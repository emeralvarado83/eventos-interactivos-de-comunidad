services:
  db:
    image: postgres:16-alpine
    container_name: twitch_events_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: twitch_events
      POSTGRES_PASSWORD: twitch_events
      POSTGRES_DB: twitch_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch_events -d twitch_events"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
